<div class="navbar" role="navigation">
  <nav class="menu" aria-label="Primary">
    <a class="menu-brand" href="/">{{ site.title }}</a>
    <div class="menu-links">
      {%- for menu in site.data.menus -%}
        <a class="menu-link{% if page.url == menu.url %} active{% endif %}" href="{{ menu.url }}"{% if page.url == menu.url %} aria-current="page"{% endif %}{% if menu.external %} target="_blank" rel="noopener"{% endif %}>{{ menu.title }}</a>
      {%- endfor -%}
      <button type="button" id="search-open" class="menu-btn menu-search" aria-label="Search posts" aria-keyshortcuts="Control+K Meta+K">
        <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5" /><path d="M21 21l-4.6-4.6" /></svg>
        <kbd class="menu-kbd" aria-hidden="true">⌘K</kbd>
      </button>
      <button type="button" id="mode" class="menu-btn" aria-label="Toggle light and dark theme">
        <svg class="mode-sunny" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5" /><path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" /></svg>
        <svg class="mode-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
      </button>
    </div>
  </nav>
</div>
