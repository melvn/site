<footer class="footer">
  <a class="footer_item" href="https://github.com/{{ site.author.github }}" rel="noopener">github</a>
  {%- if site.author.linkedin %}
  <a class="footer_item" href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" rel="noopener">linkedin</a>
  {%- endif %}
  <a class="footer_item" href="/feed.xml">rss</a>
  <span class="footer_item">&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</span>
</footer>
{%- if site.google_analytics -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", "{{ site.google_analytics }}");
</script>
{%- endif -%}
