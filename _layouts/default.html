---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{% include header.html %}

<body data-layout="{{ page.layout }}" data-default-theme="{{ site.mode }}" class="notransition">
  <script>
    (function () {
      var body = document.body;
      var saved = localStorage.getItem("theme");
      var fallback = body.getAttribute("data-default-theme");
      var theme = saved || (fallback === "dark" || fallback === "light" ? fallback : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      if (theme === "dark") { body.setAttribute("data-theme", "dark"); } else { body.removeAttribute("data-theme"); }
      setTimeout(function () { body.classList.remove("notransition"); }, 75);
    })();
  </script>

  {% include navbar.html %}
  {{ content }}
  <div class="wrapper footer-wrap">
    {% include footer.html %}
  </div>
</body>

</html>
