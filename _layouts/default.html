---
layout: compress
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
{% include header.html %}

<body data-theme="{{ site.mode }}" class="notransition">
  <script>
    (function () {
      var body = document.body;
      var theme = localStorage.getItem("theme") || body.getAttribute("data-theme");
      if (theme === "dark") {
        body.setAttribute("data-theme", "dark");
      } else {
        body.removeAttribute("data-theme");
      }
      setTimeout(function () { body.classList.remove("notransition"); }, 75);
    })();
  </script>

  {% include navbar.html %}
  {{ content }}
  <div class="wrapper footer-wrap">
    {% include footer.html %}
  </div>
</body>

</html>
