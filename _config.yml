# Site settings
title: Melvin Goxhaj # site title
description: >- # site description
  Data analyst at ANZ. Computer Science graduate from Swinburne University of Technology, majoring in AI.
  Building reliable ML systems and production-ready tools.
lang: en-US # default lang
timezone: Australia/Melbourne # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/melvn/site # site repo [optional]
mode: dark # default theme "dark" | "light"

# Profile settings
author:
  name: Melvin Goxhaj # author name
  bio: >- # tell to the world
    Data analyst at ANZ in Melbourne. Computer Science graduate from Swinburne University of Technology,
    majoring in Artificial Intelligence. I'm interested in difficult problems with simple solutions.
  username: melvingoxhaj # general username
  github: melvingoxhaj # github username
  linkedin: melvin-goxhaj-336a16260 # linkedin username
  twitter: # twitter username
  email: # email adress
  avatar: /assets/img/me.jpg

# URL settings
url: "https://klise.now.sh" #
baseurl:
permalink: /:title/
google_analytics: # leave it blank if not wish

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
